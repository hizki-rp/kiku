<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Tomoshibi — In the booth</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&amp;family=Zen+Maru+Gothic:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0B}
a{color:#E11D2B}a:hover{color:#FF5A5F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B0B; color: #FFFFFF; font-family: 'Archivo', 'Zen Maru Gothic', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 16px 12px 6px 6px; display: flex; align-items: center; gap: 6px">
    <a href="Main.dc.html" aria-label="Leave booth" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <div style="font-size: 16px; font-weight: 700">Ramen-ya at 2am</div>
      <div style="font-size: 12px; color: #A7A7A7">6 inside · host Kenji</div>
    </div>
    <div style="display: flex">
      <div style="width: 30px; height: 30px; border-radius: 15px; background: #E11D2B; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #0B0B0B">K</div>
      <div style="width: 30px; height: 30px; border-radius: 15px; background: #3A3A3A; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #0B0B0B; margin-left: -8px">A</div>
      <div style="width: 30px; height: 30px; border-radius: 15px; background: #2A2A2A; color: #FFFFFF; font-size: 11px; display: flex; align-items: center; justify-content: center; border: 2px solid #0B0B0B; margin-left: -8px">+4</div>
    </div>
  </div>

  <div style="margin: 4px 16px 0; display: flex; align-items: center; gap: 10px; font-size: 13px">
    <div style="font-family: 'Archivo', sans-serif; font-weight: 800; text-transform: uppercase; color: #FFFFFF; background: {{accent}}; padding: 2px 8px; border-radius: 6px; font-size: 12px">ON MIC</div>
    <div style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Kenji · 夜の駅で <span style="color: #A7A7A7">At the night station</span></div>
    <div style="font-family: 'Archivo', sans-serif; font-weight: 800; text-transform: uppercase; color: #A7A7A7; font-size: 12px">1:12</div>
  </div>
  <div style="margin: 8px 16px 0; height: 4px; border-radius: 2px; background: #2A2A2A">
    <div style="width: 42%; height: 4px; border-radius: 2px; background: {{accent}}"></div>
  </div>

  <div style="margin: 14px 16px 0; background: #000000; border: 1px solid #2A2A2A; border-radius: 20px; padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 8px; justify-content: flex-end">
      <button onClick="{{toggleRuby}}" aria-pressed="{{showRuby}}" style="{{rubyBtn}}">Furigana</button>
      <button onClick="{{toggleTr}}" aria-pressed="{{showTr}}" style="{{trBtn}}">English</button>
    </div>
    <sc-for list="{{lines}}" as="line" hint-placeholder-count="3">
      <div style="{{line.rowStyle}}">
        <div style="display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 2px 4px">
          <sc-for list="{{line.words}}" as="w" hint-placeholder-count="4">
            <button onClick="{{w.pick}}" aria-label="{{w.label}}" style="{{w.wordStyle}}">
              <span style="{{w.rubyStyle}}">{{w.reading}}</span>
              <span>{{w.text}}</span>
            </button>
          </sc-for>
        </div>
        <sc-if value="{{line.showTr}}" hint-placeholder-val="{{ true }}">
          <div style="text-align: center; font-size: 14px; color: #BDBDBD; margin-top: 4px">{{line.en}}</div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="margin: 12px 16px 0; background: #FFFFFF; color: #000000; border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center">
    <div style="font-size: 32px; font-weight: 700; min-width: 64px; text-align: center">{{sel.text}}</div>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 13px; color: #4A4A4A">{{sel.reading}} · {{sel.romaji}}</div>
      <div style="font-size: 15px; font-weight: 700">{{sel.meaning}}</div>
      <div style="font-size: 12px; color: #4A4A4A; line-height: 1.4">{{sel.note}}</div>
    </div>
    <button aria-label="Save word to My words" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #0B0B0B; color: {{accent}}; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
    </button>
  </div>

  <div style="flex: 1; min-height: 0; margin: 12px 16px 0; display: flex; flex-direction: column; gap: 8px; overflow: hidden; justify-content: flex-end">
    <div style="font-size: 13px; color: #A7A7A7">Up next · Aster — Kissaten Blues</div>
    <div style="font-size: 14px; line-height: 1.4"><b style="color: #FF5A5F">Aster</b> 灯り = akari, I learned that today</div>
    <div style="font-size: 14px; line-height: 1.4"><b style="color: #FF5A5F">Yuki</b> Kenji your voice is so warm</div>
    <div style="display: flex; gap: 6px">
      <button style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #2A2A2A; background: #181818; color: #FFFFFF; font-family: inherit; font-size: 13px; cursor: pointer">Nice!</button>
      <button style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #2A2A2A; background: #181818; color: #FFFFFF; font-family: inherit; font-size: 13px; cursor: pointer">Encore</button>
      <button style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #2A2A2A; background: #181818; color: #FFFFFF; font-family: inherit; font-size: 13px; cursor: pointer">Clap</button>
    </div>
  </div>

  <div style="padding: 10px 16px 24px; display: flex; gap: 8px; align-items: center">
    <label style="flex: 1; height: 48px; border-radius: 24px; background: #181818; border: 1px solid #2A2A2A; display: flex; align-items: center; padding: 0 16px">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message the booth</span>
      <input placeholder="Say something kind…" style="flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: #FFFFFF; font-family: inherit; font-size: 15px">
    </label>
    <button onClick="{{raise}}" style="{{raiseStyle}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v4"></path></svg>
      {{raiseLabel}}
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E11D2B","options":["#E11D2B","#FF4D4D","#B3121F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { showTr: true, showRuby: true, sel: '1-1', raised: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#E11D2B';
    const { showTr, showRuby, sel, raised } = this.state;
    const dict = {
      '夜': ['よる', 'yoru', 'night', 'Noun. 夜の… = "of the night".'],
      'の': ['の', 'no', 'of / ’s', 'Particle linking two nouns.'],
      '駅': ['えき', 'eki', 'station', 'Noun. Train station.'],
      'で': ['で', 'de', 'at / in', 'Particle: where an action happens.'],
      '君': ['きみ', 'kimi', 'you', 'Soft, familiar "you" — very common in songs.'],
      'を': ['を', 'o', '(object marker)', 'Marks what the verb acts on.'],
      '待つ': ['まつ', 'matsu', 'to wait', 'Verb, dictionary form.'],
      '小さな': ['ちいさな', 'chiisana', 'small, little', 'Adjective before a noun.'],
      '灯り': ['あかり', 'akari', 'a light, lamp glow', 'Same 灯 as ともしび (tomoshibi) — this app’s name.'],
      'ひとつ': ['ひとつ', 'hitotsu', 'one (thing)', 'Counter for general things.'],
      'また': ['また', 'mata', 'again', 'Adverb. また明日 = see you tomorrow.'],
      '明日': ['あした', 'ashita', 'tomorrow', 'Noun.'],
      '歌おう': ['うたおう', 'utaou', 'let’s sing', 'Volitional form of 歌う (utau, to sing).']
    };
    const raw = [
      { words: ['夜', 'の', '駅', 'で', '君', 'を', '待つ'], en: 'At the night station, I wait for you', sung: 7 },
      { words: ['小さな', '灯り', 'ひとつ'], en: 'Just one small light', sung: 2 },
      { words: ['また', '明日', '歌おう'], en: 'Let’s sing again tomorrow', sung: 0 }
    ];
    const current = 1;
    let selWord = null;
    const lines = raw.map((ln, li) => {
      const isCur = li === current;
      const words = ln.words.map((t, wi) => {
        const id = li + '-' + wi;
        const d = dict[t];
        const isSel = id === sel;
        if (isSel) selWord = { text: t, reading: d[0], romaji: d[1], meaning: d[2], note: d[3] };
        const hasKanji = /[一-龯]/.test(t);
        const sung = wi < ln.sung;
        let color = '#FFFFFF';
        if (li < current) color = '#8A7D90';
        else if (isCur && sung) color = accent;
        const size = isCur ? 30 : 20;
        return {
          text: t,
          reading: d[0],
          label: t + ', ' + d[1] + ', ' + d[2],
          pick: () => this.setState({ sel: id }),
          rubyStyle: 'font-size: ' + (isCur ? 11 : 9) + 'px; line-height: 1.2; color: #A7A7A7; visibility: ' + (showRuby && hasKanji ? 'visible' : 'hidden'),
          wordStyle: 'display: flex; flex-direction: column; align-items: center; background: ' + (isSel ? 'rgba(225,29,43,0.16)' : 'transparent') +
            '; border: none; border-bottom: 2px ' + (isSel ? 'solid ' + accent : 'dotted #4A4A4A') +
            '; border-radius: 6px 6px 0 0; padding: 2px 3px; min-height: 44px; cursor: pointer; font-family: inherit; font-weight: ' + (isCur ? 700 : 500) +
            '; font-size: ' + size + 'px; color: ' + color
        };
      });
      return {
        words,
        en: ln.en,
        showTr,
        rowStyle: 'display: flex; flex-direction: column; opacity: ' + (li === current ? 1 : 0.75)
      };
    });
    const pill = (on) => 'height: 32px; padding: 0 12px; border-radius: 16px; font-family: inherit; font-size: 12px; cursor: pointer; ' +
      (on ? 'background: #FFFFFF; color: #000000; border: 1px solid #FFFFFF; font-weight: 700' : 'background: transparent; color: #A7A7A7; border: 1px solid #2A2A2A');
    return {
      accent,
      lines,
      showTr,
      showRuby,
      sel: selWord || { text: '', reading: '', romaji: '', meaning: '', note: '' },
      toggleTr: () => this.setState({ showTr: !showTr }),
      toggleRuby: () => this.setState({ showRuby: !showRuby }),
      trBtn: pill(showTr),
      rubyBtn: pill(showRuby),
      raise: () => this.setState({ raised: !raised }),
      raiseLabel: raised ? '2nd in line' : 'Sing next',
      raiseStyle: 'height: 48px; padding: 0 16px; border-radius: 24px; font-family: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; ' +
        (raised ? 'background: transparent; color: ' + accent + '; border: 1px solid ' + accent : 'background: ' + accent + '; color: #FFFFFF; border: 1px solid ' + accent)
    };
  }
}
</script>
</body>
</html>
